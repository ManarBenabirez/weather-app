<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <div class="search-box">
      <button class="location-btn" title="Use my location"><i class="bx bxs-map"></i></button>
      <input type="text" id="cityInput" placeholder="Enter your location">
      <button class="search-btn" title="Search"><i class="bx bx-search"></i></button>
    </div>

    <section class="weather-box hidden" id="weather">
      <h2 class="city" id="cityName"></h2>
      <img id="weatherIcon" src="images/cloud.png" alt="Weather icon">
      <p class="temperature" id="temperature"></p>
      <p class="description" id="condition"></p>
    </section>

    <section class="weather-details hidden" id="details">
      <div class="humidity">
        <i class="bx bx-water"></i>
        <div class="text">
          <span id="humidity">0%</span>
          <p>Humidity</p>
        </div>
      </div>
      <div class="wind">
        <i class="bx bx-wind"></i>
        <div class="text">
          <span id="wind">0 km/h</span>
          <p>Wind Speed</p>
        </div>
      </div>
    </section>

    <section class="not-found hidden" id="error">
      <img src="images/404.png" alt="Not found">
      <p id="errorMessage"></p>
    </section>
  </main>
</body>
</html>
