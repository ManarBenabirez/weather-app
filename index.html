<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Weather App</title>
  <link href="https://unpkg.com/boxicons/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
  <script src="script.js" defer></script>
  <div class="container">
    <div class="search-box">
      <button class="location-btn"><i class="bx bxs-map"></i></button> <!-- Geolocation Button -->
      <input type="text" id="cityInput" placeholder="Enter your location">
      <button class="search-btn"><i class="bx bx-search"></i></button> <!-- Search Icon -->
    </div>
    <div class="weather-box" id="weather" style="display: none;">
      <div class="box">
        <div class="info-weather">
          <div class="weather" id="cityName"></div>
          <img id="weatherIcon" src="zcloud.png" alt="Weather Icon">
          <p class="temperature" id="temperature"></p>
          <p class="description" id="condition"></p>
        </div>
      </div>
    </div>
    <div class="weather-details">
      <div class="humidity">
        <i class="bx bx-water"></i>
        <div class="text">
          <div class="info-humidity">
            <span id="humidity">0%</span>
          </div>
          <p>Humidity</p>
        </div>
      </div>
      <div class="wind">
        <i class='bx bx-wind'></i>
        <div class="text">
          <div class="info-wind">
            <span id="wind">0 km/h</span>
          </div>
          <p>Wind Speed</p>
        </div>
      </div>
    </div>
    <div id="error" style="color: red; text-align: center; margin-top: 10px;"></div>
  </div>
</body>
</html>
